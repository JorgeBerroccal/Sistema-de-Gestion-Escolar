; Dimensionado por variables de entorno según el tamaño de la máquina (contracts/variables-entorno.md).
; Los valores por defecto (ENV de la imagen) reproducen la configuración de desarrollo.
[www]
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE}
pm.max_spare_servers = ${FPM_MAX_SPARE}
pm.max_requests = 500
php_admin_value[memory_limit] = ${PHP_MEMORY_LIMIT}
