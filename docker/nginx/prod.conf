# nginx de staging/producción: redirección a HTTPS, desafío ACME y TLS. Plantilla de envsubst
# de la imagen oficial: ${FQDN} es el nombre DNS público (los $variables de nginx no se tocan).

# Cualquier otro nombre de host (acceso por IP, etc.) no se atiende.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Comprobación de vida de nginx para el healthcheck del contenedor (no revela información)
    location = /salud-nginx {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name ${FQDN};
    server_tokens off;

    # Desafío HTTP-01 de Let's Encrypt (renovación con webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${FQDN};

    ssl_certificate     /etc/letsencrypt/live/${FQDN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${FQDN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets compilados con hash en el nombre
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # TLS termina en este nginx: Laravel debe generar URLs https sin confiar en cabeceras de proxy
        fastcgi_param HTTPS on;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
